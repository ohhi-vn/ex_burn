[workspace]

[package]
name = "ex_burn_nif"
version = "0.1.0"
edition = "2021"
authors = ["nickagard <nickagard@gmail.com>"]
description = "Rust NIF bridge between Elixir and the Burn deep learning framework"
license = "Apache-2.0"

[lib]
name = "ex_burn_nif"
crate-type = ["cdylib"]

[features]
default = []
cuda = ["burn/cuda"]
metal = ["burn/metal"]
vulkan = ["burn/vulkan"]

[dependencies]
rustler = "=0.37.4"

# Burn deep learning framework
burn = { version = "=0.21.0", features = ["cubecl"], default-features = false }
burn-cubecl = "=0.21.0"
burn-autodiff = "=0.21.0"
burn-tensor = "=0.21.0"
burn-ndarray = "=0.21.0"

# Random number generation for dropout
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 0
