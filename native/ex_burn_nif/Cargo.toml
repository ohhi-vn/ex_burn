[package]
name = "ex_burn_nif"
version = "0.1.0"
edition = "2021"
authors = ["nickagard <nickagard@gmail.com>"]
description = "Rust NIF bridge between Elixir and the Burn deep learning framework"
license = "MIT"

[lib]
name = "ex_burn_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37"

# Burn deep learning framework with CubeCL backend
burn = { version = "0.21", features = ["cubecl"] }
burn-cubecl = "0.21"
burn-autodiff = "0.21"
burn-tensor = "0.21"
burn-ndarray = "0.21"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
